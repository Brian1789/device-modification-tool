[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "device-modification-tool"
version = "0.1.0"
description = "Lightweight ADB, Fastboot, and developer-owned Magisk module toolkit"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
device-tool = "cli.main:main"

[tool.setuptools]
packages = ["cli", "adb", "fastboot", "device", "magisk", "configuration", "diagnostics", "logging_tool", "backup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
